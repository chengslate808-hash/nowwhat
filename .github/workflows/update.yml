name: hourly-update
on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub may run a few minutes late)
  push:
    branches: [main]     # code changes (e.g. a merged repair PR) go live right away
  workflow_dispatch:      # "Run workflow" button
permissions:
  contents: read
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt && npm install --no-audit --no-fund
      - name: Fetch data + write AI summary
        run: python update.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}              # e.g. https://nowwhat.today (used to read last hour's data)
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Make sure the account has a workers.dev subdomain (first run only)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cur=$(curl -s -H "$auth" "$api" | python3 -c "import sys,json;print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))")
          if [ -n "$cur" ]; then echo "subdomain: $cur.workers.dev"; exit 0; fi
          for name in nowwhat nowwhat-today nowwhat-live; do
            r=$(curl -s -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
            echo "$r" | grep -q '"success":true' && { echo "registered $name.workers.dev"; exit 0; }
            echo "could not take $name: $r"
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish to Cloudflare (site + 30-second live worker)
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Give the live worker the AI key (first run only)
        run: |
          if npx --yes wrangler@4 secret list | grep -q '"ANTHROPIC_API_KEY"'; then
            echo "AI key already set"
          else
            printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
